function iact(id){const i=db.data.sales[id];modal(`<h3>Invoice #${E(i.no)}</h3><p>${E(i.cust)} · ${i.date}<br><b>Rs ${F2(inT(i))}</b></p><div class="btns"><button class="pb" onclick="closeM();tload('s','${id}')">Edit</button><button class="ob" onclick="closeM();tload('s','${id}',1)">Print</button><button class="db" onclick="idel('${id}')">Delete</button></div>`)}
function idel(id){if(!confirm('Invoice delete kar dein?'))return;del('sales',id);closeM();render()}
VW.help=()=>`<div class="card"><h3>📖 Kaise istemal karein</h3><ol style="padding-left:18px;line-height:1.7"><li><b>Pehli dafa:</b> More → Settings: company naam, credit din likhein. Phir Products, Customers, Suppliers add karein (ya Import file).</li><li><b>Sale Invoice:</b> Sale tab → Customer chunein → Item likhein/chunein → + Add. Batch, Qty, Bonus, Disc % badal sakte hain. "Sab items par Disc %" mein 15 likh kar "Sab par lagayein" dabayein. Received abhi mein jo paisa mile wo likhein. Save dabayein.</li><li><b>Edit:</b> Sale ke neeche list ya Invoice List mein bill par tap karein → Edit. Badal kar Save karein.</li><li><b>Print:</b> Invoice mein Print / PDF dabayein. "Save as PDF" chun kar WhatsApp par bhej sakte hain. Bill par pichla baqaya aur kul baqaya khud aata hai.</li><li><b>Deals:</b> More → Purchase Deals → + Add: company, product, Buy aur Bonus likhein, Deal type Sale ya Purchase. Sale deal wale item par invoice mein bonus khud lagta hai (jaise 10 par 1 free).</li><li><b>Purchase:</b> Purchase tab → Supplier → Item → Batch aur Expiry likhein → Save. Stock khud barhta hai.</li><li><b>Receipts/Payments/Expenses:</b> Rozana paisa lena dena likhein. Record par tap karke edit ya delete.</li><li><b>Dashboard:</b> Home par date chun kar us din ki sale, profit aur item-wise bikri dekhein.</li><li><b>Backup:</b> Settings → Backup (file) kabhi kabhi download karein.</li></ol></div>`;
/* ---- reports ---- */
function setF(v){FL=v;render()}
const stockRows=()=>{const{P,S}=stk(),f=Q.toLowerCase(),rs=Object.values(P).map(p=>({p,s:S[p.c],t:stat(p,S[p.c])})).filter(x=>(FL=='all'||(FL=='LOW'?x.t!='OK':x.t==FL))&&(!f||(x.p.n+x.p.c).toLowerCase().includes(f))),tv=rs.reduce((a,x)=>a+x.s.cl*N(x.p.cost),0);return`<p>Stock value (cost): <b>Rs ${F(tv)}</b></p>`+tbl(['Code','Item','Opening','Purchased','Sold','Closing','Value','Status'],rs.map(x=>`<tr><td>${E(x.p.c)}</td><td>${E(x.p.n)}</td><td class="n">${F(x.s.op)}</td><td class="n">${F(x.s.pu)}</td><td class="n">${F(x.s.so)}</td><td class="n"><b>${F(x.s.cl)}</b></td><td class="n">${F(x.s.cl*N(x.p.cost))}</td><td><span class="bd ${x.t}">${x.t}</span></td></tr>`))};
VW.stock=()=>`<div class="card"><div style="margin-bottom:6px">${chips(['all','LOW','OUT'],FL,'setF')}</div><input style="width:100%" placeholder="Search item" value="${E(Q)}" oninput="Q=this.value;$('rs').innerHTML=stockRows()"><div id="rs">${stockRows()}</div></div>`;
VW.batch=()=>{const{P,B}=stk(),rs=Object.values(B).filter(b=>b.pu-b.so>0).map(b=>({b,d:b.ex?dd(b.ex,today()):9999})).map(x=>({...x,t:exSt(x.d)})).filter(x=>FL=='all'||x.t==FL).sort((a,b)=>a.d-b.d);
return`<div class="card"><div style="margin-bottom:6px">${chips(['all','EXPIRED','NEAR','OK'],FL,'setF')}</div>${tbl(['Item','Batch','Expiry','Balance','Din','Status'],rs.map(x=>`<tr><td>${E((P[x.b.c]||{}).n||x.b.c)}</td><td>${E(x.b.b)}</td><td>${x.b.ex||'-'}</td><td class="n">${F(x.b.pu-x.b.so)}</td><td class="n">${x.d==9999?'-':x.d}</td><td><span class="bd ${x.t}">${x.t}</span></td></tr>`))}</div>`};
function setP(v){PR=v;render()}
VW.profit=()=>{const p=per(),r=PR=='Custom'?[$('pf')?$('pf').value:today(),$('pt')?$('pt').value:today()]:p[PR],x=prof(r[0],r[1]);return`<div class="card">${chips(Object.keys(p).concat('Custom'),PR,'setP')}${PR=='Custom'?`<div class="r"><input id="pf" type="date" value="${MS.f||r[0]}" onchange="MS.f=this.value;render()"><input id="pt" type="date" value="${MS.t||r[1]}" onchange="MS.t=this.value;render()"></div>`:''}<div class="g" style="margin-top:8px"><div class="st" style="background:#1f6feb"><b>${F(x.sa)}</b><span>Sale</span></div><div class="st" style="background:#f59e0b"><b>${F(x.co)}</b><span>Cost</span></div><div class="st" style="background:#12a37f"><b>${F(x.gp)}</b><span>Gross profit</span></div><div class="st" style="background:#e5484d"><b>${F(x.ex)}</b><span>Expenses</span></div></div><h2 style="text-align:center">Net profit: Rs ${F(x.np)} <small style="color:var(--mu)">(${x.sa?(x.np/x.sa*100).toFixed(1):0}%)</small></h2></div><div class="card"><h3>Item-wise profit</h3>${tbl(['Item','Qty','Sale','Profit'],x.it.slice(0,40).map(i=>`<tr><td>${E((pf(i.c)||{}).n||i.c)}</td><td class="n">${F(i.q)}</td><td class="n">${F(i.a)}</td><td class="n">${F(i.p)}</td></tr>`))}</div>`};
const aging=(k)=>{const a=bal(k);return`<div class="card"><p>Total: <b>Rs ${F(a.reduce((s,o)=>s+o.bal,0))}</b></p>${tbl(['Naam','Opening','Bill','Mile/Diye','Balance','Overdue','0-30','31-60','61-90','90+'],a.map(o=>`<tr onclick="${k=='c'?`MS.c='${E(o.n).replace(/'/g,'')}';go('stmt')`:''}"><td>${E(o.n)}</td><td class="n">${F(o.ob)}</td><td class="n">${F(o.tot)}</td><td class="n">${F(o.pd)}</td><td class="n"><b>${F(o.bal)}</b></td><td class="n" style="color:var(--er)">${F(o.od)}</td>${o.ag.map(v=>`<td class="n">${F(v)}</td>`).join('')}</tr>`))}</div>`};
VW.deb=()=>aging('c');VW.cre=()=>aging('s');
VW.stmt=()=>{const n=MS.c||'',c=L('customers').find(x=>x.n==n);let r=[],b=c?N(c.ob):0;if(n){L('sales').filter(i=>i.cust==n).forEach(i=>r.push({d:i.date,t:'Invoice '+i.no,dr:inT(i),cr:0}));L('receipts').filter(x=>x.p==n).forEach(x=>r.push({d:x.date,t:'Receipt '+(x.inv||''),dr:0,cr:N(x.amt)}));r.sort((a,b)=>a.d<b.d?-1:1)}
return`<div class="card"><label>Customer<input list="dl-customers" value="${E(n)}" onchange="MS.c=this.value;render()"></label>${n?`<p>Opening: Rs ${F(b)}</p>`+tbl(['Date','Detail','Bill','Received','Balance'],r.map(x=>{b+=x.dr-x.cr;return`<tr><td>${x.d}</td><td>${E(x.t)}</td><td class="n">${x.dr?F(x.dr):''}</td><td class="n">${x.cr?F(x.cr):''}</td><td class="n"><b>${F(b)}</b></td></tr>`}))+`<h3>Baqaya: Rs ${F(b)}</h3><button class="pb" onclick="pst()">Print</button>`:''}</div>`};
function pst(){$('pr').innerHTML='<h2>'+E(cfg().name)+' - Customer Statement: '+E(MS.c)+'</h2>'+document.querySelector('#app table').outerHTML;print()}
VW.set=()=>`<div class="card"><h3>Company</h3><label>Naam<input id="s_n" value="${E(cfg().name)}"></label><div class="r"><label>Customer credit din<input id="s_cd" type="number" value="${cfg().cd}"></label><label>Supplier credit din<input id="s_sd" type="number" value="${cfg().sd}"></label></div><div class="r"><label>Expiry alert (din)<input id="s_ed" type="number" value="${cfg().ed}"></label><label>Trade discount %<input id="s_tp" type="number" value="${cfg().tp}"></label></div><button class="pb" onclick="ssv()">Save settings</button></div>
<div class="card"><h3>☁️ Cloud Sync (Supabase)</h3><textarea id="csx" rows="3" style="width:100%;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:8px" placeholder="Supabase URL aur Key wala text yahan paste karein"></textarea><div class="btns"><button class="pb" onclick="scon()">Connect and Sync Now</button></div><p style="color:var(--mu);font-size:12px">Is app ki table ka naam acc hai. Status: ${SC.url?'connected':'band'}</p></div>
<div class="card"><h3>Backup / Import</h3><div class="btns"><button onclick="bex()">Backup (file)</button><button onclick="$('imf').click()">Import (file)</button></div></div>`;
function ssv(){Object.assign(db.cfg,{name:$('s_n').value,cd:N($('s_cd').value),sd:N($('s_sd').value),ed:N($('s_ed').value),tp:N($('s_tp').value)});db.ts['cfg']=Date.now();sv();toast('Settings save');render()}
function scon(){const v=$('csx').value,u=v.match(/https:\/\/[a-z0-9-]+\.supabase\.co/i),k=v.match(/sb_publishable_[\w-]+|eyJ[\w-]+\.[\w-]+\.[\w-]+/);if(!u||!k){toast('URL ya Key nahi mili');return}SC={url:u[0],key:k[0]};localStorage.setItem('dsconn',JSON.stringify(SC));db.seeded=0;db.last='';syncNow();toast('Connect ho raha hai')}
function bex(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({v:1,cfg:db.cfg,data:db.data})],{type:'application/json'}));a.download='rhmr-accounts-'+today()+'.json';a.click()}
$('imf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());let n=0;if(j.cfg)Object.assign(db.cfg,j.cfg);COLS.forEach(c=>Object.entries((j.data||{})[c]||{}).forEach(([id,d])=>{db.data[c][id]=d;const k=c+'/'+id;db.ts[k]=Date.now();db.q[k]=1;n++}));sv();later();render();toast('Import ho gaya: '+n+' records')}catch(x){toast('File sahi nahi')}e.target.value=''};
$('st').onclick=()=>{SC.url?syncNow():go('set')};addEventListener('online',syncNow);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncNow()});setInterval(()=>{if(!document.hidden)syncNow()},15000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();syncNow();
</script></body></html>
